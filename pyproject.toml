[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xphi"
version = "1.0.1+bound"
description = "Internal Core Engine for Fiber (Not for standalone use)"
requires-python = ">=3.10"
dependencies = [
    "uvloop", "redis", "pyyaml", "watchdog", "rocksdict", "requests", "deprecated", "Pillow", "tiktoken", "PyNaCl",
    "libcst", "pydantic", "httpx", "eclipse-zenoh", "mcp",
    "tinytag", "dataclasses_json"
]

[project.scripts]
anchor-bind = "xphi.kernel.space.bind.around:run_around"

[tool.hatch.build.targets.wheel.force-include]
"arch" = "xphi/arch"
"kernel" = "xphi/kernel"
"state" = "xphi/state"
"watcher" = "xphi/watcher"