services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: ${COMPOSE_ROOT}/Dockerfile.xphi
    volumes:
      - ${FIBER_ARTIFACT_MOUNT:-/tmp}:/artifact_mount
    environment:
      - XPHI_ENV=ci
    network_mode: "service:redis"
    depends_on:
      redis:
        condition: service_healthy
    command: sleep infinity
